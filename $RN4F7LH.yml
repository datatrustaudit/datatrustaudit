version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gtmaudit_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gtmaudit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gtmaudit_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db-data:
