<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- O favicon é a marca reduzida ao que sobrevive a 16 px.
       Os pixels que se desprendem e a malha de tags saem: nesse tamanho viram
       sujeira em vez de significado. Ficam o escudo e a conferência.
       O escudo é preenchido, não vazado como no logo grande — em aba clara ou
       escura, um contorno fino de 16 px some; a mancha sólida não. -->
  <defs>
    <linearGradient id="escudo" x1="10" y1="6" x2="55" y2="58">
      <stop offset="0%" stop-color="#12285C"/>
      <stop offset="100%" stop-color="#1A63E8"/>
    </linearGradient>
    <linearGradient id="conferido" x1="24" y1="27" x2="37" y2="37">
      <stop offset="0%" stop-color="#22B5D8"/>
      <stop offset="100%" stop-color="#35D0EE"/>
    </linearGradient>
  </defs>

  <path d="M32 4 L56 12.5 V33 C56 46.8 46 56.8 32 60.5 C18 56.8 8 46.8 8 33 V12.5 L32 4Z"
        fill="url(#escudo)"/>

  <!-- Lupa: lente clara sobre o escudo, com o cabo saindo em 45°. -->
  <path d="M39.5 40.5 L48 49" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="31" cy="32" r="13" fill="#FFFFFF"/>
  <path d="M24.5 32.4 L29.2 37 L37 27.4"
        stroke="url(#conferido)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
